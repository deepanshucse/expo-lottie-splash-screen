name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; setup-node's bundled
      # npm on node 20 is older than that.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (src/)
        run: npm test -- --ci

      - name: Plugin tests (plugin/src/)
        run: npm run test:plugin -- --ci

      - name: Build
        run: npm run build:all

      - name: Verify package.json version matches the release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag '$TAG_NAME' does not match package.json version '$PKG_VERSION' (expected tag '$EXPECTED_TAG')."
            exit 1
          fi

      # Trusted Publishing: npm authenticates via this workflow's OIDC token
      # (see the id-token: write permission above) once this repo/workflow is
      # registered as a trusted publisher for the package on npmjs.com — no
      # NPM_TOKEN secret needed.
      - name: Publish to npm
        run: npm publish --access public --provenance
