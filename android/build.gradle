plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

// Single source of truth for the version: package.json
def packageJson = new groovy.json.JsonSlurper().parse(file("../package.json"))

group = 'expo.modules.lottiesplashscreen'
version = packageJson.version

android {
  namespace "expo.modules.lottiesplashscreen"
  defaultConfig {
    versionCode 1
    versionName packageJson.version
  }
  lint {
    abortOnError false
  }
}

dependencies {
  // Lottie for Android (LottieAnimationView extends AppCompatImageView)
  implementation 'com.airbnb.android:lottie:6.4.0'
  // AppCompat required — LottieAnimationView is a subclass of AppCompatImageView
  implementation 'androidx.appcompat:appcompat:1.7.0'
  // AndroidX SplashScreen API (backport for Android 12 SplashScreen on API 21+)
  implementation 'androidx.core:core-splashscreen:1.0.1'
}
